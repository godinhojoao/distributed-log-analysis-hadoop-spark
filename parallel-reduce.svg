<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs>
<rect width="760" height="650" fill="#ffffff"/>
<text x="20" y="34" font-size="16" font-weight="bold" fill="#333">Sequential: one worker, 5 steps, each waits for the previous result</text>
<g font-size="15" text-anchor="middle">
<text x="60" y="71" font-size="12" fill="#777" text-anchor="start">step 1</text>
<rect x="110" y="50" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="132" y="71" fill="#1e3a8a">1</text>
<text x="171" y="71" fill="#333">+</text>
<rect x="188" y="50" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="210" y="71" fill="#1e3a8a">2</text>
<text x="249" y="71" fill="#333">=</text>
<rect x="266" y="50" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="288" y="71" fill="#78350f">3</text>
<path d="M288 82 C 288 98, 132 90, 132 104" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
<text x="60" y="127" font-size="12" fill="#777" text-anchor="start">step 2</text>
<rect x="110" y="106" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="132" y="127" fill="#78350f">3</text>
<text x="171" y="127" fill="#333">+</text>
<rect x="188" y="106" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="210" y="127" fill="#1e3a8a">3</text>
<text x="249" y="127" fill="#333">=</text>
<rect x="266" y="106" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="288" y="127" fill="#78350f">6</text>
<path d="M288 138 C 288 154, 132 146, 132 160" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
<text x="60" y="183" font-size="12" fill="#777" text-anchor="start">step 3</text>
<rect x="110" y="162" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="132" y="183" fill="#78350f">6</text>
<text x="171" y="183" fill="#333">+</text>
<rect x="188" y="162" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="210" y="183" fill="#1e3a8a">4</text>
<text x="249" y="183" fill="#333">=</text>
<rect x="266" y="162" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="288" y="183" fill="#78350f">10</text>
<path d="M288 194 C 288 210, 132 202, 132 216" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
<text x="60" y="239" font-size="12" fill="#777" text-anchor="start">step 4</text>
<rect x="110" y="218" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="132" y="239" fill="#78350f">10</text>
<text x="171" y="239" fill="#333">+</text>
<rect x="188" y="218" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="210" y="239" fill="#1e3a8a">5</text>
<text x="249" y="239" fill="#333">=</text>
<rect x="266" y="218" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="288" y="239" fill="#78350f">15</text>
<path d="M288 250 C 288 266, 132 258, 132 272" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
<text x="60" y="295" font-size="12" fill="#777" text-anchor="start">step 5</text>
<rect x="110" y="274" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="132" y="295" fill="#78350f">15</text>
<text x="171" y="295" fill="#333">+</text>
<rect x="188" y="274" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="210" y="295" fill="#1e3a8a">6</text>
<text x="249" y="295" fill="#333">=</text>
<rect x="266" y="274" width="44" height="32" rx="6" fill="#dcfce7" stroke="#22c55e"/><text x="288" y="295" fill="#14532d" font-weight="bold">21</text>
</g>
<text x="340" y="160" font-size="13" fill="#777">the result of each step becomes</text>
<text x="340" y="178" font-size="13" fill="#777">the left side of the next one</text>
<text x="20" y="350" font-size="16" font-weight="bold" fill="#333">Parallel tree: workers add at the same time, 3 steps</text>
<g stroke="#999" stroke-width="2"><line x1="100" y1="402" x2="145" y2="452"/><line x1="190" y1="402" x2="145" y2="452"/><line x1="290" y1="402" x2="335" y2="452"/><line x1="380" y1="402" x2="335" y2="452"/><line x1="480" y1="402" x2="525" y2="452"/><line x1="570" y1="402" x2="525" y2="452"/><line x1="145" y1="484" x2="240" y2="524"/><line x1="335" y1="484" x2="240" y2="524"/><line x1="240" y1="556" x2="385" y2="588"/><line x1="525" y1="484" x2="385" y2="588"/></g>
<g font-size="15" text-anchor="middle">
<rect x="78" y="370" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="100" y="391" fill="#1e3a8a">1</text>
<rect x="168" y="370" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="190" y="391" fill="#1e3a8a">2</text>
<rect x="268" y="370" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="290" y="391" fill="#1e3a8a">3</text>
<rect x="358" y="370" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="380" y="391" fill="#1e3a8a">4</text>
<rect x="458" y="370" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="480" y="391" fill="#1e3a8a">5</text>
<rect x="548" y="370" width="44" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="570" y="391" fill="#1e3a8a">6</text>
<rect x="123" y="452" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="145" y="473" fill="#78350f">3</text>
<text x="173" y="473" font-size="12" fill="#777" text-anchor="start">1+2</text>
<rect x="313" y="452" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="335" y="473" fill="#78350f">7</text>
<text x="363" y="473" font-size="12" fill="#777" text-anchor="start">3+4</text>
<rect x="503" y="452" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="525" y="473" fill="#78350f">11</text>
<text x="553" y="473" font-size="12" fill="#777" text-anchor="start">5+6</text>
<rect x="218" y="524" width="44" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="240" y="545" fill="#78350f">10</text>
<text x="268" y="545" font-size="12" fill="#777" text-anchor="start">3+7</text>
<rect x="360" y="588" width="50" height="34" rx="6" fill="#dcfce7" stroke="#22c55e"/><text x="385" y="610" font-weight="bold" fill="#14532d">21</text>
<text x="416" y="610" font-size="12" fill="#777" text-anchor="start">10+11</text>
</g>
<g font-size="13" fill="#777">
<text x="620" y="391">input</text>
<text x="620" y="473">step 1 (3 adds at once)</text>
<text x="620" y="545">step 2</text>
<text x="620" y="610">step 3 → result</text>
</g></svg>
